apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  name: local-storage-set
  namespace: openshift-local-storage
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  nodeSelector:
    nodeSelectorTerms:
    - matchExpressions:
      - key: node-role.kubernetes.io/local-storage
        operator: Exists

  storageClassName: local-sc
  volumeMode: Filesystem
  fsType: xfs

  deviceInclusionSpec:
    devicePaths:
      - /dev/sdb
